name: Deploy

# The site on Cloudflare Workers (wrangler.jsonc), driven by scripts/cloudflare.mjs.
#   push to the branch below, or task "deploy": Pro guard, wrangler deploy, missing Worker secrets, then checks of
#     the workers.dev copy and, once it serves it, of icons.meyalab.com; failed checks put the previous version back
#   task "secrets": replaces the Worker's Polar and GitHub secrets with the repository's
#   task "status": how icons.meyalab.com is served
#   task "cutover": checks the workers.dev copy, sends icons.meyalab.com to the Worker with no gap, then checks it;
#     if those checks fail, it undoes what it changed
#   task "rollback": undoes the cutover, then waits for the old host to answer again
# Tasks are started through the API (gh workflow run deploy.yml --ref <this branch> -f task=status): GitHub shows
# no "Run workflow" button for a workflow that is not on the default branch.
# Needs the repository secret CLOUDFLARE_API_TOKEN (see scripts/cloudflare.mjs for its permissions). Optional
# repository secrets POLAR_ORG_ID, POLAR_PRO_BENEFIT_ID, POLAR_ACCESS_TOKEN and PRO_GITHUB_TOKEN go to the Worker.
on:
  push:
    branches: [claude/continue-session-012dkbuoexzgfm3ew4ku9qxr-thmfk3]
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [deploy, secrets, status, cutover, rollback]
        default: deploy

permissions:
  contents: read

# a rollback never waits behind a deploy or a cutover
concurrency:
  group: ${{ inputs.task == 'rollback' && 'rollback' || 'deploy' }}
  cancel-in-progress: false

jobs:
  cloudflare:
    # only this branch goes live: main still has files that must not
    if: github.ref == 'refs/heads/claude/continue-session-012dkbuoexzgfm3ew4ku9qxr-thmfk3'
    runs-on: ubuntu-latest
    # a step that hangs must not hold the queue (the custom-domain check may wait 15 minutes for DNS)
    timeout-minutes: 45
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TASK: ${{ inputs.task || 'deploy' }}
      WRANGLER_BIN: ${{ github.workspace }}/.github/deploy/node_modules/.bin/wrangler
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Cloudflare token
        if: env.READY != 'true'
        run: echo "::notice::The CLOUDFLARE_API_TOKEN repository secret is not set yet, so nothing was done."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 22
      # wrangler and its whole dependency tree as package-lock.json pins them, installed with no secret around
      - name: Install wrangler
        if: env.READY == 'true'
        timeout-minutes: 10
        run: npm ci --prefix .github/deploy --no-audit --no-fund
      - name: Cloudflare account
        if: env.READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare.mjs prepare
      - name: Pro guard
        if: env.READY == 'true' && env.TASK == 'deploy'
        run: node scripts/guard.mjs
      - name: Remember the live version
        if: env.READY == 'true' && env.TASK == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare.mjs version
      - name: Deploy the Worker
        if: env.READY == 'true' && env.TASK == 'deploy'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$WRANGLER_BIN" deploy'
      - name: Worker secrets
        if: env.READY == 'true' && (env.TASK == 'deploy' || env.TASK == 'secrets')
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLAR_ORG_ID: ${{ secrets.POLAR_ORG_ID }}
          POLAR_PRO_BENEFIT_ID: ${{ secrets.POLAR_PRO_BENEFIT_ID }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          PRO_GITHUB_TOKEN: ${{ secrets.PRO_GITHUB_TOKEN }}
        run: node scripts/cloudflare.mjs secrets $([ "$TASK" = secrets ] && echo --update)
      # a cutover only moves the domain to a Worker that passes these checks
      - name: Check the workers.dev copy
        id: dev
        if: env.READY == 'true' && env.TASK != 'status' && env.TASK != 'rollback'
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          node scripts/smoke.mjs "$WORKERS_URL"
          code=$?
          if [ "$code" = 4 ]; then echo "::warning::Cloudflare challenged the check, so the workers.dev copy was not verified"; fi
          [ "$code" = 0 ] || { [ "$code" = 4 ] && [ "$TASK" != cutover ]; }
      - name: Move icons.meyalab.com to the Worker
        if: env.READY == 'true' && env.TASK == 'cutover'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare.mjs cutover
      - name: Move icons.meyalab.com back
        if: env.READY == 'true' && env.TASK == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/cloudflare.mjs rollback
          SMOKE_EXPECT=old SMOKE_WAIT=600 node scripts/smoke.mjs https://icons.meyalab.com
      - name: Status
        if: env.READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/cloudflare.mjs status
          # what the rest of the internet sees (all public)
          echo "Name servers: $(dig +short NS meyalab.com | tr '\n' ' ')"
          echo "icons.meyalab.com resolves to: $(dig +short icons.meyalab.com | tr '\n' ' ')"
          curl -sSI --max-time 15 https://icons.meyalab.com/ | grep -iE '^(HTTP|server|x-vercel-id|cf-ray|cf-mitigated|location)' || true
      - name: Check icons.meyalab.com
        id: domain
        if: env.READY == 'true' && env.ON_WORKER == '1'
        timeout-minutes: 30
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          # wait up to 15 minutes for resolvers that still hold the old answer
          SMOKE_WAIT=900 node scripts/smoke.mjs https://icons.meyalab.com
          code=$?
          if [ "$code" = 4 ]; then echo "::warning::Cloudflare challenged the check, so icons.meyalab.com was not verified"; exit 0; fi
          # undo only what this run changed: a re-run of a finished cutover never sends a live site back
          if [ "$code" = 1 ] && [ "$TASK" = cutover ] && [ "$CUTOVER_CHANGED" = 1 ]; then
            echo "::error::icons.meyalab.com failed its checks on the Worker, so the cutover is undone"
            node scripts/cloudflare.mjs rollback
            SMOKE_EXPECT=old SMOKE_WAIT=600 node scripts/smoke.mjs https://icons.meyalab.com
          fi
          exit $code
      # a deploy whose copy fails its checks does not stay live
      - name: Put the previous version back
        if: failure() && env.TASK == 'deploy' && env.PREVIOUS_VERSION != '' && (steps.dev.outcome == 'failure' || steps.domain.outcome == 'failure')
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$WRANGLER_BIN" rollback "$PREVIOUS_VERSION" --message "Checks failed after deploy" --yes'
