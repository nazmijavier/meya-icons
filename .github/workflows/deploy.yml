name: Deploy

# The site on Cloudflare Workers (wrangler.jsonc), driven by scripts/cloudflare.mjs.
#   push to the branch below, or task "deploy": Pro guard, wrangler deploy, Worker secrets, then checks of the
#     deployed copy (and of icons.meyalab.com once it is served by the Worker)
#   task "status": how icons.meyalab.com is served
#   task "cutover": checks the workers.dev copy, sends icons.meyalab.com to the Worker with no gap, then checks it;
#     if those checks fail, it undoes what it changed
#   task "rollback": undoes the cutover, then waits for the old host to answer again
# Needs the repository secret CLOUDFLARE_API_TOKEN (see scripts/cloudflare.mjs for its permissions). Optional
# repository secrets POLAR_ORG_ID, POLAR_PRO_BENEFIT_ID, POLAR_ACCESS_TOKEN and PRO_GITHUB_TOKEN are copied to the
# Worker. Only this branch deploys: main still has files that must not go live.
on:
  push:
    branches: [claude/continue-session-012dkbuoexzgfm3ew4ku9qxr-thmfk3]
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [deploy, status, cutover, rollback]
        default: deploy

permissions:
  contents: read

# a rollback never waits behind a deploy or a cutover
concurrency:
  group: ${{ inputs.task == 'rollback' && 'rollback' || 'deploy' }}
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TASK: ${{ inputs.task || 'deploy' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Cloudflare token
        if: env.READY != 'true'
        run: echo "::notice::The CLOUDFLARE_API_TOKEN repository secret is not set yet, so nothing was done."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 22
      - name: Cloudflare account
        if: env.READY == 'true'
        run: node scripts/cloudflare.mjs prepare
      - name: Pro guard
        if: env.READY == 'true' && env.TASK == 'deploy'
        run: node scripts/guard.mjs
      - name: Deploy the Worker
        if: env.READY == 'true' && env.TASK == 'deploy'
        run: npx --yes wrangler@4.151.1 deploy
      - name: Worker secrets
        if: env.READY == 'true' && env.TASK == 'deploy'
        env:
          POLAR_ORG_ID: ${{ secrets.POLAR_ORG_ID }}
          POLAR_PRO_BENEFIT_ID: ${{ secrets.POLAR_PRO_BENEFIT_ID }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          PRO_GITHUB_TOKEN: ${{ secrets.PRO_GITHUB_TOKEN }}
        run: node scripts/cloudflare.mjs secrets
      # a cutover only moves the domain to a Worker that passes these checks
      - name: Check the workers.dev copy
        if: env.READY == 'true' && (env.TASK == 'deploy' || env.TASK == 'cutover')
        run: node scripts/smoke.mjs "$WORKERS_URL"
      - name: Move icons.meyalab.com to the Worker
        if: env.READY == 'true' && env.TASK == 'cutover'
        run: node scripts/cloudflare.mjs cutover
      - name: Move icons.meyalab.com back
        if: env.READY == 'true' && env.TASK == 'rollback'
        run: |
          node scripts/cloudflare.mjs rollback
          SMOKE_EXPECT=old SMOKE_WAIT=600 node scripts/smoke.mjs https://icons.meyalab.com
      - name: Status
        if: env.READY == 'true'
        run: |
          node scripts/cloudflare.mjs status
          # what the rest of the internet sees (all public)
          echo "Name servers: $(dig +short NS meyalab.com | tr '\n' ' ')"
          echo "icons.meyalab.com resolves to: $(dig +short icons.meyalab.com | tr '\n' ' ')"
          curl -sSI --max-time 15 https://icons.meyalab.com/ | grep -iE '^(HTTP|server|x-vercel-id|cf-ray|location)' || true
      - name: Check icons.meyalab.com
        if: env.READY == 'true' && env.ON_WORKER == '1'
        shell: bash
        run: |
          set +e
          # wait up to 15 minutes for resolvers that still hold the old answer
          SMOKE_WAIT=900 node scripts/smoke.mjs https://icons.meyalab.com
          code=$?
          # undo only what this run changed: a re-run of a finished cutover never sends a live site back
          if [ "$code" = 1 ] && [ "$TASK" = cutover ] && [ "$CUTOVER_CHANGED" = 1 ]; then
            echo "::error::icons.meyalab.com failed its checks on the Worker, so the cutover is undone"
            node scripts/cloudflare.mjs rollback
            SMOKE_EXPECT=old SMOKE_WAIT=600 node scripts/smoke.mjs https://icons.meyalab.com
          fi
          exit $code
