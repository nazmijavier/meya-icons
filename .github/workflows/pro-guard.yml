name: Pro guard

# Fails a push or pull request that would publish Meya Icons Pro (see scripts/guard.mjs).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/guard.mjs
